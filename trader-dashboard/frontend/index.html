<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        body { background-color: #030712; } /* Extremely dark gray/black */
    </style>
</head>
<body class="text-gray-100 font-sans min-h-screen flex flex-col h-screen">

    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur-md px-6 py-4 flex justify-between items-center shrink-0">
        <div>
            <h1 class="text-xl font-bold tracking-wide text-emerald-400">📈 TraderBlotter AI</h1>
            <p class="text-xs text-gray-400 mt-0.5">Local Text-to-SQL Engine</p>
        </div>
        <div class="flex items-center space-x-2 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span class="text-xs text-gray-300 font-mono" id="connection-status">System Ready</span>
        </div>
    </header>

    <main id="chat-container" class="flex-1 w-full max-w-4xl mx-auto p-6 overflow-y-auto space-y-6 pb-32">
        
        <div class="flex justify-start">
            <div class="bg-gray-900 border border-gray-800 text-gray-200 rounded-2xl rounded-tl-none p-5 max-w-2xl shadow-sm">
                <p class="text-sm leading-relaxed text-gray-300">
                    Welcome to your local data terminal. I am connected to your SQLite database containing <strong>Funds</strong> and <strong>Daily PnL</strong>. Ask me anything in plain English!
                </p>
                <div class="mt-4 flex flex-wrap gap-2">
                    <button class="sample-btn text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg px-3 py-1.5 text-emerald-400 transition">Show me top 3 funds by daily PnL</button>
                    <button class="sample-btn text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg px-3 py-1.5 text-emerald-400 transition">What is the worst PnL for Emma Jenkins?</button>
                </div>
            </div>
        </div>

    </main>

    <footer class="fixed bottom-0 w-full bg-gradient-to-t from-gray-950 via-gray-950/90 to-transparent pt-10 pb-6 px-4">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-3 relative">
            <input type="text" id="user-input" required autocomplete="off"
                placeholder="Ask a data question..." 
                class="flex-1 bg-gray-900 border border-gray-700 rounded-xl pl-5 pr-4 py-4 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition shadow-lg text-white placeholder-gray-500">
            
            <button type="submit" id="submit-btn"
                class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-6 py-4 rounded-xl transition shadow-lg active:scale-95 flex items-center justify-center min-w-[100px]">
                <span>Execute</span>
            </button>
        </form>
    </footer>

    <script src="script.js"></script>
</body>
</html>
